# Tema nativo do Streamlit — mantido em sincronia com core.config.PALETTE.
# O CSS de ui/styles.py cobre os componentes custom; estes tokens garantem
# que inputs, popovers e demais widgets nativos também permaneçam claros.
[theme]
base = "light"
primaryColor = "#0F9F8F"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#071A36"
font = "sans serif"

# A sidebar é o rail de navegação e usa a mesma superfície branca dos cards.
[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"

[server]
headless = true

[browser]
gatherUsageStats = false
