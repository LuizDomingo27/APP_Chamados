name: Auditoria de dependências

on:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Instalar pip-audit
        run: pip install pip-audit==2.10.1
      - name: Auditar o lockfile
        run: pip-audit --require-hashes --disable-pip -r requirements-dev-lock.txt
